<!doctype html>
<html lang="am">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#05070f" />
    <title>Africa Bingo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        gap: 14px;
        background: radial-gradient(120% 90% at 50% 0%, #101b33 0%, #05070f 62%);
        font-family: 'Outfit', 'Noto Sans Ethiopic', system-ui, sans-serif;
        color: #eff6ff;
        text-align: center;
      }
      #boot-splash .bs-inner {
        display: grid;
        justify-items: center;
        gap: 12px;
        padding: 24px;
      }
      #boot-splash img {
        width: 96px;
        height: 96px;
        border-radius: 26px;
        box-shadow: 0 18px 44px rgba(247, 201, 72, 0.28);
        animation: bs-pop 1.6s ease-in-out infinite alternate;
      }
      #boot-splash .bs-name {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 0.06em;
        background: linear-gradient(92deg, #ffe9a8, #f7c948 55%, #d99a1d);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #boot-splash .bs-am {
        font-size: 15px;
        color: #9fb0cd;
        font-family: 'Noto Sans Ethiopic', sans-serif;
      }
      #boot-splash .bs-bar {
        width: 150px;
        height: 4px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.12);
      }
      #boot-splash .bs-bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #ffe9a8, #f7c948);
        animation: bs-slide 1.1s ease-in-out infinite;
      }
      @keyframes bs-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(280%); }
      }
      @keyframes bs-pop {
        from { transform: scale(0.97); }
        to { transform: scale(1.03); }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <div class="bs-inner">
        <img src="/logo.svg" alt="Africa Bingo" />
        <div class="bs-name">AFRICA BINGO</div>
        <div class="bs-am">አፍሪካ ቢንጎ — በመጫን ላይ…</div>
        <div class="bs-bar"><span></span></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
