# Production stack for a single free Oracle Cloud / VPS instance.
# Caddy terminates HTTPS for the Telegram Mini App and proxies WebSockets.
# PostgreSQL runs in a volume-backed container; the ledger no longer lives in a
# SQLite file. Set POSTGRES_PASSWORD in .env (see server/.env.example).
#
#   cp server/.env.example .env      # fill in DOMAIN, JWT_SECRET, bot token
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Player app: https://$DOMAIN/ · Admin: https://$DOMAIN/admin · Agent: https://$DOMAIN/agent
# Pinned project name so volume names are stable (the backup cron uses them).
name: ethio-bingo

services:
  bingo:
    build: .
    restart: unless-stopped
    expose:
      - '4000'
    environment:
      PORT: '4000'
      NODE_ENV: production
      NODE_OPTIONS: '--max-old-space-size=2048'
      DATABASE_URL: postgresql://bingo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/bingo
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      # Must be the real HTTPS URL: Telegram refuses to open the Mini App
      # otherwise and referral links break. No localhost fallback in production.
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env, e.g. https://bingo.example.com}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in .env, e.g. https://bingo.example.com}
      # Always false in production: only signed Telegram initData is accepted.
      DEV_MODE: 'false'
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bingo.et}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      AGENT_EMAIL: ${AGENT_EMAIL:-agent@bingo.et}
      AGENT_PASSWORD: ${AGENT_PASSWORD:-Agent@12345}
      DEPOSIT_TELEBIRR_ACCOUNT: ${DEPOSIT_TELEBIRR_ACCOUNT:-}
      DEPOSIT_TELEBIRR_NAME: ${DEPOSIT_TELEBIRR_NAME:-}
      DEPOSIT_CBE_ACCOUNT: ${DEPOSIT_CBE_ACCOUNT:-}
      DEPOSIT_CBE_NAME: ${DEPOSIT_CBE_NAME:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - bingo-uploads:/app/server/uploads
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/api/health']
      interval: 30s
      timeout: 5s
      retries: 5
      # First boot runs `prisma db push` and the seed, which is slow on ARM.
      start_period: 180s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bingo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: bingo
    volumes:
      - bingo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bingo -d bingo']
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      bingo:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  bingo-pgdata:
  bingo-uploads:
  caddy-data:
  caddy-config:
